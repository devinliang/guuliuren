<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guuliuren — 探索世界</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <header class="hero" role="banner">
        <div class="hero__bg" style="background-image: url('./assets/mainbg.jpg');"></div>
        <div class="hero__overlay" aria-hidden="true"></div>

        <div class="hero__content">
            <h1 class="hero__title">谷遊拾光<br><span class="hero__title-subline">一場可以帶走的旅行</span></h1>
            <p class="hero__subtitle">用創意紀錄縱谷的每一道光<br>谷鹿鹿領路，溜進人與土地的連結</p>
        </div>

    <main id="discover">
